name: CI

on:
  pull_request:
    branches:
      - innox-edits
      - main
      - master

  push:
    branches:
      - innox-edits
      - main
      - master

jobs:

  # ==========================================================
  # 1. BUILD
  # ==========================================================
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: node --check index.js

      - name: Build application
        run: npm run build --if-present


  # ==========================================================
  # 2. TESTS
  # ==========================================================
  test:
    name: Run tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # ==========================================================
  # 3. VULNERABILITY SCAN
  # ==========================================================
  vulnerability-scan:
    name: Vulnerability scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm vulnerability scan
        run: npm audit --audit-level=high


  # ==========================================================
  # 4. DOCKER BUILD + PUSH
  #    Only after code is pushed/merged to the target branch
  # ==========================================================
  docker:
    name: Build and push Docker image
    needs:
      - build
      - test
      - vulnerability-scan

    # Don't push Docker images from pull requests
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/my-demo-repo:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/my-demo-repo:${{ github.sha }}


  # ==========================================================
  # 5. HELM
  # ==========================================================
  helm:
    name: Validate Helm chart
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Check Helm
        run: helm version

      - name: Lint Helm chart
        run: helm lint ./web-app

      - name: Render Helm templates
        run: helm template web-app ./web-app