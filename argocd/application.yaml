apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: web-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/innox123/node-hello.git
    targetRevision: innox-edits
    path: web-app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true